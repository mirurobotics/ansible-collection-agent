name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ansible-core

      - name: Verify the tag matches galaxy.yml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(awk '/^version:/{print $2; exit}' galaxy.yml)"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match galaxy.yml version ${version}" >&2
            exit 1
          fi

      - name: Build the collection
        run: ansible-galaxy collection build --output-path dist

      - name: Publish to Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "${GALAXY_API_KEY}" ]; then
            echo "GALAXY_API_KEY repository secret is not set" >&2
            exit 1
          fi
          ansible-galaxy collection publish dist/*.tar.gz --api-key "${GALAXY_API_KEY}"
