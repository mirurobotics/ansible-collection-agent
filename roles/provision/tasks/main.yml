- name: Verify the agent version is set
  ansible.builtin.assert:
    that:
      - miru_agent_version is defined
      - miru_agent_version | length > 0
    fail_msg: >-
      miru_agent_version is required (e.g. "0.10.1"). Use "latest" only when
      you intentionally want the newest package on every run.

- name: Verify the API key is set
  ansible.builtin.assert:
    that:
      - miru_api_key is defined
      - miru_api_key | length > 0
    fail_msg: >-
      miru_api_key is required. Create an API key (see
      https://docs.mirurobotics.com/admin/apikeys).

- name: Set up the Miru apt repository
  ansible.builtin.import_tasks: repo.yml

- name: Install the miru-agent package
  ansible.builtin.import_tasks: install.yml

- name: Provision the device
  ansible.builtin.import_tasks: provision.yml
