- name: Check the installed miru-agent version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${Status}|${Version}
      - miru-agent
  register: miru_agent_installed
  changed_when: false
  failed_when: false
  check_mode: false

# Skip apt entirely when the pinned version is already installed. Otherwise
# refresh the index first: at most hourly for "latest" on a device that
# already has the agent and an unchanged Miru repo, and always in every other
# case (first install, a version bump, a changed repo, or a run whose earlier
# refresh failed).
- name: Install miru-agent
  ansible.builtin.apt:
    name: "miru-agent{% if miru_agent_version != 'latest' %}={{ miru_agent_version }}{% endif %}"
    state: "{{ 'latest' if miru_agent_version == 'latest' else 'present' }}"
    update_cache: true
    cache_valid_time: >-
      {{
        3600
        if miru_agent_version == 'latest'
          and miru_apt_repo is not changed
          and miru_agent_installed.stdout is match('[^ ]+ ok installed[|]')
        else 0
      }}
  become: true
  when: >-
    miru_agent_version == 'latest'
    or miru_agent_installed.stdout is not match('[^ ]+ ok installed[|]' ~ (miru_agent_version | regex_escape) ~ '$')

- name: Ensure the miru service is enabled and running
  ansible.builtin.systemd:
    name: miru
    enabled: true
    state: started
  become: true
