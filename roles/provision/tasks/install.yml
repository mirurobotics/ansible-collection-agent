- name: Install miru-agent from a .deb URL
  when: miru_agent_deb_url | length > 0
  ansible.builtin.apt:
    deb: "{{ miru_agent_deb_url }}"
    state: present
  become: true

- name: Install miru-agent from apt
  when: miru_agent_deb_url | length == 0
  ansible.builtin.apt:
    name: "miru-agent{% if miru_agent_version != 'latest' %}={{ miru_agent_version }}{% endif %}"
    state: "{{ 'latest' if miru_agent_version == 'latest' else 'present' }}"
    update_cache: "{{ miru_apt_repo is changed }}"
  become: true

- name: Ensure the miru service is enabled and running
  ansible.builtin.systemd:
    name: miru
    enabled: true
    state: started
  become: true
