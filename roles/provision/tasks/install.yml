- name: Check the installed miru-agent version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${Status}|${Version}
      - miru-agent
  register: miru_agent_installed
  changed_when: false
  failed_when: false
  check_mode: false

# Refresh the apt index only when the install can need it:
# - the Miru repo was just added or changed: always refresh.
# - "latest" with the agent installed: refresh at most hourly to see upgrades.
# - a pinned version that isn't installed yet (first install, a version bump,
#   or a run whose earlier refresh failed): always refresh.
# A device that already has the pinned version skips the refresh entirely.
- name: Install miru-agent
  ansible.builtin.apt:
    name: "miru-agent{% if miru_agent_version != 'latest' %}={{ miru_agent_version }}{% endif %}"
    state: "{{ 'latest' if miru_agent_version == 'latest' else 'present' }}"
    update_cache: >-
      {{
        miru_apt_repo is changed
        or miru_agent_version == 'latest'
        or miru_agent_installed.stdout != 'install ok installed|' ~ miru_agent_version
      }}
    cache_valid_time: >-
      {{
        3600
        if miru_apt_repo is not changed
          and miru_agent_version == 'latest'
          and miru_agent_installed.stdout is match('install ok installed[|]')
        else 0
      }}
  become: true

- name: Ensure the miru service is enabled and running
  ansible.builtin.systemd:
    name: miru
    enabled: true
    state: started
  become: true
