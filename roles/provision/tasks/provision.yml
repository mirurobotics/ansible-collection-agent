# `provision --check` is read-only. Exit 0 = already provisioned, 3 = not
# provisioned, anything else = state could not be determined (fail the play).
- name: Check if the device is already provisioned
  ansible.builtin.command:
    argv:
      - /usr/sbin/miru-agent
      - provision
      - --check
  become: true
  become_user: miru
  # The miru user has no home dir, so Ansible's default ~/.ansible/tmp warns
  # on every run. /tmp always exists and miru can write to it.
  vars:
    ansible_remote_tmp: /tmp
  register: miru_check
  changed_when: false
  check_mode: false
  failed_when: miru_check.rc not in [0, 3]

- name: Record provisioned state
  ansible.builtin.set_fact:
    miru_provisioned: "{{ miru_check.rc == 0 }}"

- name: Provision the device with a fresh token
  when: not miru_provisioned
  block:
    # this step does not expose the API key to device being provisioned so we use
    # localhost delegate_to
    - name: Mint a provisioning token
      ansible.builtin.uri:
        url: "{{ miru_api_base_url }}/provisioning_tokens"
        method: POST
        headers:
          Miru-Version: "{{ miru_api_version }}"
          X-API-Key: "{{ miru_api_key }}"
        status_code: 200
      register: miru_token_response
      delegate_to: localhost
      become: false
      no_log: "{{ not (miru_log_secrets | bool) }}"

    # token has a short expiry, provisioning needs to run immediately after.
    # The token goes in on stdin, not through `environment:`. With become,
    # Ansible inlines `environment:` into the sudo command line, so the token
    # would show up in `ps`, sudo's log, and -vvv output despite no_log. The
    # shell reads stdin into the variable and execs the agent. The
    # --device-name flag is passed as "$1" so it is never parsed as shell code;
    # it keeps its prefix so the command module's `~` expansion can't touch it.
    - name: Provision the device
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - >-
            MIRU_PROVISIONING_TOKEN="$(cat)" &&
            export MIRU_PROVISIONING_TOKEN &&
            exec /usr/sbin/miru-agent provision "$1"
          - miru-provision
          - "--device-name={{ miru_device_name }}"
        stdin: "{{ miru_token_response.json.token }}"
        stdin_add_newline: false
      become: true
      become_user: miru
      # The miru user has no home dir, so Ansible's default ~/.ansible/tmp
      # warns on every run. /tmp always exists and miru can write to it.
      vars:
        ansible_remote_tmp: /tmp
      changed_when: true
      no_log: "{{ not (miru_log_secrets | bool) }}"

- name: Verify the miru service is active
  ansible.builtin.systemd:
    name: miru
    state: started
  become: true
  check_mode: true
  register: miru_service_check
  failed_when: miru_service_check is changed
