# The apt module refreshes the package index before it checks what is
# installed, so on an already set up device it would run apt-get update on
# every play. Check with dpkg first and only touch apt when something is
# missing.
- name: Check which apt prerequisites are installed
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${Status}\n
      - ca-certificates
      - python3-debian
  register: miru_apt_prereqs
  changed_when: false
  failed_when: false
  check_mode: false

# python3-debian is required by the deb822_repository module
- name: Ensure apt prerequisites are present
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: >-
    miru_apt_prereqs.rc != 0
    or miru_apt_prereqs.stdout_lines | reject('equalto', 'install ok installed') | list | length > 0

- name: Add the Miru apt repository
  ansible.builtin.deb822_repository:
    name: miru
    types: deb
    uris: "{{ miru_apt_url }}"
    suites: stable
    components: main
    architectures: "{{ miru_apt_architecture }}"
    signed_by: "{{ miru_apt_key_url }}"
  become: true
  register: miru_apt_repo
