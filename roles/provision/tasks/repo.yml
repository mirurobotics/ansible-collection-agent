- name: Ensure apt HTTPS prerequisites are present
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Add the Miru apt repository
  ansible.builtin.deb822_repository:
    name: miru
    types: deb
    uris: "{{ miru_apt_url }}"
    suites: stable
    components: main
    architectures: "{{ miru_apt_architecture }}"
    signed_by: "{{ miru_apt_key_url }}"
  become: true
  register: miru_apt_repo
