- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Assert miru-agent is installed
      ansible.builtin.assert:
        that: "'miru-agent' in ansible_facts.packages"

    - name: Stat the Miru apt source
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/miru.sources
      register: miru_sources

    - name: Assert the Miru apt source is present
      ansible.builtin.assert:
        that: miru_sources.stat.exists

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert the miru service is known to systemd
      ansible.builtin.assert:
        that: "'miru.service' in ansible_facts.services"

    - name: Assert the device is not provisioned (install-only converge)
      ansible.builtin.find:
        paths: /var/lib/miru/auth
        file_type: file
      register: miru_auth_files
      failed_when: miru_auth_files.files | length > 0
