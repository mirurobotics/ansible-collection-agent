# Offline of the control plane: apt source + install via the role.
# Token minting is not exercised here.
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Set up the Miru apt repository
      ansible.builtin.include_role:
        name: provision
        tasks_from: repo.yml

    - name: Install miru-agent
      ansible.builtin.include_role:
        name: provision
        tasks_from: install.yml
