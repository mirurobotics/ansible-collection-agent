driver:
  name: docker
platforms:
  - name: miru-agent-${MOLECULE_DISTRO:-ubuntu2404}
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ""
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    group_vars:
      all:
        miru_agent_version: "{{ lookup('env', 'MOLECULE_AGENT_VERSION') | default('0.10.2', true) }}"
        ansible_python_interpreter: >-
          {{ '/usr/bin/python3.9'
             if (lookup('env', 'MOLECULE_DISTRO') | default('ubuntu2404', true)) == 'ubuntu2004'
             else '/usr/bin/python3' }}
verifier:
  name: ansible
