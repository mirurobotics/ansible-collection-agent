driver:
  name: docker
platforms:
  - name: miru-agent-${MOLECULE_DISTRO:-ubuntu2404}
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ""
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    group_vars:
      all:
        miru_agent_deb_tag: "{{ lookup('env', 'MOLECULE_AGENT_TAG') | default('v0.10.2-beta.1', true) }}"
verifier:
  name: ansible
