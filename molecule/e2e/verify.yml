- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check if the device is already provisioned
      ansible.builtin.command:
        argv:
          - /usr/sbin/miru-agent
          - provision
          - --check
      become: true
      become_user: miru
      register: miru_check
      changed_when: false
      failed_when: miru_check.rc not in [0, 3]

    - name: Assert the device is provisioned
      ansible.builtin.assert:
        that:
          - miru_check.rc == 0
          - miru_check.stdout == "provisioned"
        fail_msg: >-
          expected provision --check to exit 0 with 'provisioned'
          (got rc={{ miru_check.rc }} stdout={{ miru_check.stdout | default('') }})

    # Second pass through provision.yml must skip minting. If --check is not 0,
    # the role would POST /provisioning_tokens again.
    - name: Re-run provision tasks on an already-provisioned host
      ansible.builtin.include_role:
        name: provision
        tasks_from: provision.yml
